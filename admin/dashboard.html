<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#081b33;
      color:white;
      display:flex;
    }

    /* SIDEBAR */

    .sidebar{
      width:250px;
      height:100vh;

      background:#061423;

      padding:30px 20px;

      position:fixed;
    }

    .sidebar h2{
      color:#8fd3ff;
      margin-bottom:40px;
    }

    .sidebar a{

      display:block;

      color:white;

      text-decoration:none;

      margin:20px 0;

      transition:0.3s;
    }

    .sidebar a:hover{
      color:#8fd3ff;
    }

    /* MAIN */

    .main{

      margin-left:250px;

      padding:40px;

      width:100%;
    }

    .cards{

      display:grid;

      grid-template-columns:
      repeat(auto-fit,minmax(250px,1fr));

      gap:20px;

      margin-top:30px;
    }

    .card{

      background:#10294d;

      padding:30px;

      border-radius:20px;
    }

    .card h3{
      margin-bottom:10px;
      color:#8fd3ff;
    }

    .logout-btn{

      margin-top:40px;

      background:#ff5f7a;

      border:none;

      padding:12px 25px;

      border-radius:30px;

      color:white;

      cursor:pointer;
    }

  </style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

  <h2>BlueFrame</h2>

  <a href="#">
    Dashboard
  </a>

  <a href="#">
    Portfolio
  </a>

  <a href="#">
    Video
  </a>

  <a href="#">
    Maps
  </a>

  <a href="#">
    Kontak
  </a>

</div>

<!-- MAIN -->

<div class="main">

  <h1>
    Welcome Admin 📸
  </h1>

  <p>
    Kelola website fotografimu di sini.
  </p>

  <div class="cards">

    <div class="card">

      <h3>Total Foto</h3>

      <p>24 Foto</p>

    </div>

    <div class="card">

      <h3>Total Video</h3>

      <p>4 Video</p>

    </div>

    <div class="card">

      <h3>Pengunjung</h3>

      <p>1.2K</p>

    </div>

  </div>

  <button
  class="logout-btn"
  onclick="logout()">

    Logout

  </button>

</div>

<script>

function logout(){

  localStorage.removeItem(
    "loggedInUser"
  );

  alert("Logout berhasil!");

  window.location.href =
  "../index.html";

}

</script>

</body>
</html>
