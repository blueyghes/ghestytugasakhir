<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <title>Login</title>

  <link rel="stylesheet"
  href="login.css">

</head>

<body>

<div class="login-container">

  <h2>Login</h2>

  <form id="loginForm">

    <input
    type="text"
    id="username"
    placeholder="Username"
    required>

    <input
    type="password"
    id="password"
    placeholder="Password"
    required>

    <button type="submit">
      Login
    </button>

  </form>

  <p>
    Belum punya akun?
    <a href="register.html">
      Register
    </a>
  </p>

  <p>
    <a href="forgot.html">
      Lupa Password?
    </a>
  </p>

</div>

<script src="login.js"></script>

</body>
</html>
