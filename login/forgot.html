<!DOCTYPE html>
<html lang="id">
<head>

  <title>Lupa Password</title>

</head>

<body>

<div class="login-container">

  <h2>Lupa Password</h2>

    id="forgotUsername"

    </button>

  </form>

</div>

<script src="login.js"></script>

</body>
</html>
