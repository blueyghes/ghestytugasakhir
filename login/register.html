<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <title>Register</title>

  <link rel="stylesheet"
  href="login.css">

</head>

<body>

<div class="login-container">

  <h2>Register</h2>

  <form id="registerForm">

    <input
    type="text"
    id="username"
    placeholder="Username"
    required>

    <input
    type="email"
    id="email"
    placeholder="Email"
    required>

    <input
    type="password"
    id="password"
    placeholder="Password"
    required>

    <button type="submit">
      Register
    </button>

  </form>

</div>

<script src="login.js"></script>

</body>
</html>
